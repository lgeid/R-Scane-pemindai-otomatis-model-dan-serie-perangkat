<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-Scan v7</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; }
        .btn-blue { background: #165DFF; }
        .btn-blue:hover { background: #1550e0; }
        .model-box { background: #ecfdf3; border: 1px solid #a7f3d0; }
        .serial-box { background: #fff9eb; border: 1px solid #fed79c; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-md mx-auto px-4 py-5">
        <h1 class="text-xl font-bold text-center mb-6">R-Scan v7</h1>

        <!-- Upload -->
        <div class="bg-white rounded-xl p-4 shadow-sm mb-4">
            <input type="file" id="img-input" accept="image/*" class="hidden">
            <label for="img-input" class="block border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:border-blue-400">
                <i class="fa fa-upload text-blue-500 text-2xl"></i>
                <p class="mt-2">Pilih Foto Label</p>
            </label>
            
            <div id="preview-wrap" class="hidden mt-4">
                <img id="preview" class="w-full rounded-lg border">
                <button onclick="clearAll()" class="text-red-500 text-sm mt-2">
                    <i class="fa fa-times"></i> Hapus
                </button>
            </div>
            
            <button id="go-btn" onclick="bacaData()" disabled
                class="w-full btn-blue text-white py-3 rounded-lg mt-4 font-medium disabled:opacity-50">
                <i class="fa fa-magic"></i> Baca Data
            </button>
            
            <div id="status" class="hidden text-center py-3 text-sm text-gray-500">
                <i class="fa fa-spinner fa-spin"></i> Memproses...
            </div>
        </div>

        <!-- Hasil -->
        <div id="hasil-wrap" class="hidden">
            <div class="model-box rounded-lg p-4 mb-3">
                <div class="text-sm text-green-700 font-medium mb-1">NOMOR MODEL</div>
                <div id="model-out" class="font-mono text-lg font-bold">-</div>
            </div>
            <div class="serial-box rounded-lg p-4 mb-3">
                <div class="text-sm text-amber-700 font-medium mb-1">NOMOR SERI</div>
                <div id="serial-out" class="font-mono text-lg font-bold">-</div>
            </div>
            <div class="bg-gray-50 rounded-lg p-3 mt-4">
                <div class="text-xs text-gray-500 mb-1">📝 Teks terbaca OCR (untuk cek):</div>
                <pre id="raw-text" class="text-xs text-gray-600 whitespace-pre-wrap break-all"></pre>
            </div>
        </div>
    </div>

    <script>
        let selectedImage = null;

        document.getElementById('img-input').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                selectedImage = ev.target.result;
                document.getElementById('preview').src = selectedImage;
                document.getElementById('preview-wrap').classList.remove('hidden');
                document.getElementById('go-btn').disabled = false;
                document.getElementById('hasil-wrap').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        });

        function clearAll() {
            selectedImage = null;
            document.getElementById('img-input').value = '';
            document.getElementById('preview-wrap').classList.add('hidden');
            document.getElementById('go-btn').disabled = true;
            document.getElementById('hasil-wrap').classList.add('hidden');
        }

        async function bacaData() {
            document.getElementById('status').classList.remove('hidden');
            document.getElementById('hasil-wrap').classList.add('hidden');
            
            try {
                const result = await Tesseract.recognize(selectedImage, 'eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            document.getElementById('status').innerHTML = 
                                `<i class="fa fa-spinner fa-spin"></i> Membaca ${Math.round(m.progress*100)}%`;
                        }
                    }
                });
                
                const teks = result.data.text;
                document.getElementById('raw-text').textContent = teks;
                
                // === CARI MODEL: cari setelah "NO. MODEL" atau "NOMOR MODEL" ===
                let model = cariSetelahKata(teks, ['NO. MODEL', 'NOMOR MODEL', 'MODEL :', 'MODEL:']);
                
                // Kalau tidak ketemu, cari pola: 2 angka + huruf
                if (!model) {
                    const m = teks.match(/\b(\d{2,}[A-Z0-9]{5,})\b/);
                    if (m) model = m[1];
                }
                
                // === CARI SERI: cari setelah "NO. SERI" atau "NOMOR SERI" ===
                let serial = cariSetelahKata(teks, ['NO. SERI', 'NOMOR SERI', 'SERI:', 'NO.SERI']);
                
                // Kalau tidak ketemu, cari kode panjang yang BUKAN model
                if (!serial) {
                    const semuaKode = teks.match(/\b[A-Z0-9]{8,}\b/g) || [];
                    serial = semuaKode.find(k => k !== model && !k.startsWith('TELEVIS')) || null;
                }
                
                // Tampilkan
                document.getElementById('model-out').textContent = model || '— Tidak terbaca —';
                document.getElementById('serial-out').textContent = serial || '— Tidak terbaca —';
                document.getElementById('hasil-wrap').classList.remove('hidden');
                
            } catch (err) {
                alert('Error: ' + err.message);
            }
            
            document.getElementById('status').classList.add('hidden');
        }

        function cariSetelahKata(teks, kataKunci) {
            const upper = teks.toUpperCase();
            for (const k of kataKunci) {
                const pos = upper.indexOf(k);
                if (pos === -1) continue;
                
                const sisa = upper.substring(pos + k.length);
                // Ambil kode alfanumerik pertama
                const cocok = sisa.match(/[A-Z0-9]{5,}/);
                if (cocok) return cocok[0];
            }
            return null;
        }
    </script>
</body>
</html>
